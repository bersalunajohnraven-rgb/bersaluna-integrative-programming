<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Saved Countries</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(-45deg, #667eea, #764ba2);
  color: white;
  text-align: center;
  padding: 20px;
}

.card {
  background: white;
  color: black;
  padding: 15px;
  margin: 10px auto;
  width: 300px;
  border-radius: 10px;
}

img {
  width: 80px;
}

button {
  margin-top: 10px;
  padding: 8px;
  background: red;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>📁 Saved Countries</h1>
<div id="savedList"></div>

<script>
function loadSaved() {
  let saved = JSON.parse(localStorage.getItem("countries")) || [];
  const container = document.getElementById("savedList");

  if (saved.length === 0) {
    container.innerHTML = "<p>No saved countries yet.</p>";
    return;
  }

  container.innerHTML = saved.map((c, index) => `
    <div class="card">
      <h3>${c.name}</h3>
      <img src="${c.flag}">
      <p>Capital: ${c.capital}</p>
      <p>Population: ${c.population}</p>
      <button onclick="deleteCountry(${index})">Delete</button>
    </div>
  `).join("");
}

function deleteCountry(index) {
  let saved = JSON.parse(localStorage.getItem("countries")) || [];
  saved.splice(index, 1);
  localStorage.setItem("countries", JSON.stringify(saved));
  loadSaved();
}

loadSaved();
</script>

</body>
</html>
