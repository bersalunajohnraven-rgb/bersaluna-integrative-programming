<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | CJ4 Grocery Store</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">CJ4 Grocery Store</div>
        <ul>
          <li><a href="profile.html">Back to Profile</a></li>
          <li><a href="#" id="logoutNav">Logout</a></li>
        </ul>
      </nav>
    </header>

    <section class="settings-section">
      <h2>Settings</h2>
      <form class="settings-card" id="settingsForm">
        <label>Change Name</label>
        <input type="text" id="nameInput" placeholder="Enter your name" />

        <label>Change Phone</label>
        <input type="text" id="phoneInput" placeholder="Enter your phone" />

        <label>Change Address</label>
        <input type="text" id="addressInput" placeholder="Enter your address" />

        <label>Change Password</label>
        <input type="password" id="passwordInput" placeholder="Leave blank to keep current" />

        <button class="btn-primary" type="submit">Save Settings</button>
        <p id="settingsMsg" class="error-msg"></p>
      </form>
    </section>

    <footer>
      <p>&copy; 2025 CJ4 Grocery Store. All rights reserved.</p>
    </footer>

    <script type="module">
      import { supabase } from "./src/supabaseClient.js";
      import { getCurrentUser, signOutAndRedirect } from "./src/auth.js";

      (async () => {
      const user = await getCurrentUser();

      if (!user) {
        alert("You must log in first.");
        window.location.href = "login.html";
      } else {
        document.getElementById("nameInput").value = user.name || "";
        document.getElementById("phoneInput").value = user.phone || "";
        document.getElementById("addressInput").value = user.address || "";
      }

      const form = document.getElementById("settingsForm");
      const msg = document.getElementById("settingsMsg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";
        msg.style.color = "";

        const name = document.getElementById("nameInput").value.trim();
        const phone = document.getElementById("phoneInput").value.trim();
        const address = document.getElementById("addressInput").value.trim();
        const newPassword = document.getElementById("passwordInput").value;

        if (!name) {
          msg.textContent = "Name cannot be empty.";
          msg.style.color = "red";
          return;
        }

        const { error: profileError } = await supabase
          .from("profiles")
          .update({ name, phone, address })
          .eq("id", user.id);

        if (profileError) {
          msg.textContent = "Failed to save profile: " + profileError.message;
          msg.style.color = "red";
          return;
        }

        if (newPassword) {
          if (newPassword.length < 6) {
            msg.textContent = "Password must be at least 6 characters.";
            msg.style.color = "red";
            return;
          }
          const { error: pwError } = await supabase.auth.updateUser({
            password: newPassword,
          });
          if (pwError) {
            msg.textContent = "Profile saved, but password update failed: " + pwError.message;
            msg.style.color = "red";
            return;
          }
        }

        msg.textContent = "Settings saved successfully.";
        msg.style.color = "green";
        document.getElementById("passwordInput").value = "";
      });

      document.getElementById("logoutNav").addEventListener("click", (e) => {
        e.preventDefault();
        signOutAndRedirect();
      });
      })();
    </script>
</body>
</html>
