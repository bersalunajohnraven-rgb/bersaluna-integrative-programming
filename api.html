<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Country Explorer</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #667eea, #764ba2, #6dd5ed, #2193b0);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 15px;
  width: 450px;
  text-align: center;
}

input {
  padding: 10px;
  width: 65%;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  background: #667eea;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.view-btn {
  display: block;
  margin-top: 15px;
  padding: 12px;
  background: #764ba2;
  color: white;
  border-radius: 10px;
  text-decoration: none;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.flag {
  width: 120px;
  margin: 10px 0;
}

.info {
  background: #f4f6ff;
  padding: 8px;
  border-radius: 8px;
  margin: 5px 0;
}

.save-btn {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  background: #28a745;
  color: white;
  border-radius: 10px;
  border: none;
}

.spinner {
  border: 4px solid #eee;
  border-top: 4px solid #667eea;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.error { color: red; }
</style>
</head>

<body>

<div class="container">
  <h1>🌍 Country Explorer</h1>

  <input type="text" id="countryInput" placeholder="Enter country">
  <button onclick="searchCountry()">Search</button>

  <a href="saved.html" class="view-btn">📁 View Saved</a>

  <div id="result"></div>
</div>

<script>
function searchCountry() {
  const country = document.getElementById("countryInput").value.trim();
  const result = document.getElementById("result");

  if (!country) {
    result.innerHTML = '<p class="error">Enter a country</p>';
    return;
  }

  result.innerHTML = '<div class="spinner"></div>';

  fetch(`https://restcountries.com/v3.1/name/${country}?fullText=true`)
    .then(res => {
      if (!res.ok) throw new Error();
      return res.json();
    })
    .then(data => {
      const c = data[0];

      const countryData = {
        name: c.name.common,
        capital: c.capital ? c.capital[0] : "N/A",
        population: c.population.toLocaleString(),
        region: c.region,
        flag: c.flags.png
      };

      result.innerHTML = `
        <div class="card">
          <h2>${countryData.name}</h2>
          <img class="flag" src="${countryData.flag}">
          
          <div class="info">🏛 Capital: ${countryData.capital}</div>
          <div class="info">🌎 Region: ${countryData.region}</div>
          <div class="info">👥 Population: ${countryData.population}</div>

          <button class="save-btn" onclick='saveCountry(${JSON.stringify(countryData)})'>
            💾 Save Country
          </button>
        </div>
      `;
    })
    .catch(() => {
      result.innerHTML = '<p class="error">❌ Country not found</p>';
    });
}

function saveCountry(country) {
  let saved = JSON.parse(localStorage.getItem("countries")) || [];

  const exists = saved.some(c => c.name === country.name);

  if (exists) {
    alert("⚠️ Already saved!");
    return;
  }

  saved.push(country);
  localStorage.setItem("countries", JSON.stringify(saved));

  alert("✅ Saved!");
}

document.getElementById("countryInput")
  .addEventListener("keypress", e => {
    if (e.key === "Enter") searchCountry();
  });
</script>

</body>
</html>
