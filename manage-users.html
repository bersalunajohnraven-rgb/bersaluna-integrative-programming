<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users | CJ4 Admin</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
<nav>
<div class="logo">CJ4 Admin</div>
<ul>
<li><a href="admin.html">Dashboard</a></li>
<li><a href="profile.html">Profile</a></li>
<li><a href="#" id="logoutNav">Logout</a></li>
</ul>
</nav>
</header>

<section class="products">

<h2>Manage Users</h2>
<p>View, add, and remove user accounts.</p>

<div id="loadingMsg" style="text-align:center; padding:2rem; color:var(--gray);">
  <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i>
  <p>Loading users...</p>
</div>

<table id="usersTable" style="margin:auto; width:90%; max-width:800px; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; display:none;">
<thead style="background:var(--primary); color:white;">
<tr>
<th style="padding:1rem; text-align:left;">Name</th>
<th style="padding:1rem; text-align:left;">Email</th>
<th style="padding:1rem; text-align:left;">Role</th>
<th style="padding:1rem; text-align:left;">Action</th>
</tr>
</thead>
<tbody id="usersBody"></tbody>
</table>

<br><br>

<h3>Add User</h3>

<form id="addUserForm" style="max-width:450px; margin:auto; display:flex; flex-direction:column; gap:1rem;">
<input type="text" id="name" placeholder="Name" required style="padding:0.9rem 1rem; border-radius:8px; border:2px solid #e2e8f0; outline:none;">
<input type="email" id="email" placeholder="Email" required style="padding:0.9rem 1rem; border-radius:8px; border:2px solid #e2e8f0; outline:none;">
<input type="password" id="password" placeholder="Password (min 6 characters)" required style="padding:0.9rem 1rem; border-radius:8px; border:2px solid #e2e8f0; outline:none;">
<select id="role" style="padding:0.9rem 1rem; border-radius:8px; border:2px solid #e2e8f0; outline:none; background:white;">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button type="submit" class="btn-primary">Add User</button>
<p id="formMsg" class="error-msg"></p>
</form>

</section>

<footer>
<p>&copy; 2025 CJ4 Grocery Store</p>
</footer>

<script type="module">
import { supabase } from "./src/supabaseClient.js";
import { requireAdmin, signOutAndRedirect } from "./src/auth.js";

(async () => {
const admin = await requireAdmin();
if (!admin) {
  // requireAdmin already redirects
} else {
  init();
}

document.getElementById("logoutNav").addEventListener("click", (e) => {
  e.preventDefault();
  signOutAndRedirect();
});

async function init() {
  await loadUsers();

  document.getElementById("addUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("formMsg");
    msg.textContent = "";
    msg.style.color = "";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    if (name.length < 3) {
      msg.textContent = "Name must be at least 3 characters.";
      msg.style.color = "red";
      return;
    }
    if (password.length < 6) {
      msg.textContent = "Password must be at least 6 characters.";
      msg.style.color = "red";
      return;
    }

    const { data: session } = await supabase.auth.getSession();
    const token = session?.access_token;

    const response = await fetch(
      `${import.meta.env.VITE_SUPABASE_URL}/functions/v1/admin-manage-users?action=create`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
          apikey: import.meta.env.VITE_SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ name, email, password, role }),
      }
    );

    const result = await response.json();

    if (!response.ok) {
      msg.textContent = result.error || "Failed to create user.";
      msg.style.color = "red";
      return;
    }

    msg.textContent = "User created successfully.";
    msg.style.color = "green";
    document.getElementById("addUserForm").reset();
    await loadUsers();
  });
}

async function loadUsers() {
  const loading = document.getElementById("loadingMsg");
  const table = document.getElementById("usersTable");
  const body = document.getElementById("usersBody");

  const { data: session } = await supabase.auth.getSession();
  const token = session?.access_token;

  const response = await fetch(
    `${import.meta.env.VITE_SUPABASE_URL}/functions/v1/admin-manage-users?action=list`,
    {
      method: "GET",
      headers: {
        Authorization: `Bearer ${token}`,
        apikey: import.meta.env.VITE_SUPABASE_ANON_KEY,
      },
    }
  );

  const result = await response.json();

  loading.style.display = "none";

  if (!response.ok) {
    body.innerHTML = `<tr><td colspan="4" style="padding:1rem; text-align:center; color:red;">${result.error || "Failed to load users."}</td></tr>`;
    table.style.display = "table";
    return;
  }

  const users = result.users || [];
  body.innerHTML = users.map((u) => `
    <tr style="border-bottom:1px solid #e2e8f0;">
      <td style="padding:1rem;">${escapeHtml(u.name)}</td>
      <td style="padding:1rem;">${escapeHtml(u.email)}</td>
      <td style="padding:1rem;">
        <span style="padding:0.25rem 0.75rem; border-radius:12px; font-size:0.8rem; font-weight:700;
          background:${u.role === 'admin' ? '#fef3c7' : '#d1fae5'}; color:${u.role === 'admin' ? '#92400e' : '#065f46'};">
          ${u.role}
        </span>
      </td>
      <td style="padding:1rem;">
        ${u.id === admin.id
          ? '<span style="color:var(--gray); font-size:0.85rem;">(You)</span>'
          : `<button onclick="deleteUser('${u.id}')" style="padding:0.5rem 1rem; background:#ef4444; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Delete</button>`}
      </td>
    </tr>
  `).join("");

  table.style.display = "table";
}

window.deleteUser = async function(userId) {
  if (!confirm("Are you sure you want to delete this user?")) return;

  const { data: session } = await supabase.auth.getSession();
  const token = session?.access_token;

  const response = await fetch(
    `${import.meta.env.VITE_SUPABASE_URL}/functions/v1/admin-manage-users?action=delete`,
    {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
        apikey: import.meta.env.VITE_SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ userId }),
    }
  );

  const result = await response.json();

  if (!response.ok) {
    alert(result.error || "Failed to delete user.");
    return;
  }

  await loadUsers();
};

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}
})();
</script>

</body>
</html>
