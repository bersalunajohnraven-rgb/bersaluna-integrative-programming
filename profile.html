<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | CJ4 Grocery Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">CJ4 Grocery Store</div>
      <ul>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="login.html" id="logoutNav">Logout</a></li>
      </ul>
    </nav>
  </header>

  <section class="profile-section">
    <div class="profile-card">
      <div class="profile-header">
        <img src="https://via.placeholder.com/120" alt="Profile Picture" class="profile-pic" />
        <h2 id="profileName">User Name</h2>
        <p id="profileRole">Role</p>
      </div>

      <div class="profile-details">
        <div class="detail-item">
          <label>Email:</label>
          <span id="profileEmail"></span>
        </div>
        <div class="detail-item">
          <label>Phone:</label>
          <span id="profilePhone">+1 (555) 123-4567</span>
        </div>
        <div class="detail-item">
          <label>Address:</label>
          <span id="profileAddress">123 Main St, City, State 12345</span>
        </div>
        <div class="detail-item">
          <label>Member Since:</label>
          <span id="profileMemberSince">January 2023</span>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn-primary" onclick="window.location.href='settings.html'">Go to Settings</button>
        <button class="btn-secondary" onclick="window.location.href='index.html'">Back to Home</button>
        <button class="btn-secondary" id="logoutBtn">Logout</button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 CJ4 Grocery Store. All rights reserved.</p>
  </footer>

  <script>
    // Check if user is logged in
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (!currentUser) {
      alert("You must login first!");
      window.location.href = "login.html";
    } else {
      // Fill profile info dynamically
      document.getElementById("profileName").textContent = currentUser.name;
      document.getElementById("profileEmail").textContent = currentUser.email;
      document.getElementById("profileRole").textContent = currentUser.role;
    }

    // Logout button
    document.getElementById("logoutBtn").addEventListener("click", function() {
      localStorage.setItem("isLoggedIn", "false");
      localStorage.removeItem("currentUser");
      alert("Logged out successfully!");
      window.location.href = "login.html";
    });

    // Optional: logout link in nav
    const logoutNav = document.getElementById("logoutNav");
    logoutNav.addEventListener("click", function(e) {
      e.preventDefault();
      localStorage.setItem("isLoggedIn", "false");
      localStorage.removeItem("currentUser");
      alert("Logged out successfully!");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
