<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | CJ4 Grocery Store</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">CJ4 Grocery Store</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="#" id="logoutNav">Logout</a></li>
      </ul>
    </nav>
  </header>

  <section class="profile-section">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar"><i class="fas fa-user-circle"></i></div>
        <h2 id="profileName">Loading...</h2>
        <p id="profileRole"></p>
      </div>

      <div class="profile-details">
        <div class="detail-item">
          <label>Email:</label>
          <span id="profileEmail"></span>
        </div>
        <div class="detail-item">
          <label>Phone:</label>
          <span id="profilePhone">Not set</span>
        </div>
        <div class="detail-item">
          <label>Address:</label>
          <span id="profileAddress">Not set</span>
        </div>
        <div class="detail-item">
          <label>Member Since:</label>
          <span id="profileMemberSince"></span>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn-primary" onclick="window.location.href='settings.html'">Go to Settings</button>
        <button class="btn-secondary" onclick="window.location.href='index.html'">Back to Home</button>
        <button class="btn-secondary" id="logoutBtn">Logout</button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 CJ4 Grocery Store. All rights reserved.</p>
  </footer>

  <script type="module">
    import { getCurrentUser, signOutAndRedirect } from "./src/auth.js";

    (async () => {
    const user = await getCurrentUser();

    if (!user) {
      alert("You must log in first.");
      window.location.href = "login.html";
    } else {
      document.getElementById("profileName").textContent = user.name;
      document.getElementById("profileEmail").textContent = user.email;
      document.getElementById("profileRole").textContent =
        user.role.charAt(0).toUpperCase() + user.role.slice(1);
      document.getElementById("profilePhone").textContent = user.phone || "Not set";
      document.getElementById("profileAddress").textContent = user.address || "Not set";
      document.getElementById("profileMemberSince").textContent =
        new Date(user.created_at).toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
    }

    document.getElementById("logoutBtn").addEventListener("click", signOutAndRedirect);
    document.getElementById("logoutNav").addEventListener("click", (e) => {
      e.preventDefault();
      signOutAndRedirect();
    });
    })();
  </script>
</body>
</html>
